<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#080808" />
<meta name="description" content="Trapped in Bergen Engines — a haunted novella in thirty illustrated pages, and the ghost of Gregor." />
<title>Trapped in Bergen Engines — A Haunted Novella</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Space+Grotesk:wght@400;500;700&family=Spectral:ital,wght@0,300;1,300&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#080808; --fg:#D1D1D1; --teal:#00E5FF; --ochre:#9A6B41;
    --display:"Space Grotesk", "Inter Tight", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --body:"Inter Tight", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    --ghost:"Spectral", Georgia, "Times New Roman", serif;
    --mono:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{background:#080808}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg); font-family:var(--body);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  ::selection{background:rgba(0,229,255,.25)}
  .app{display:flex; flex-direction:column; height:100dvh; overflow:hidden}

  /* Header */
  header{flex:0 0 auto; border-bottom:1px solid rgba(255,255,255,.07); padding:16px 20px}
  @media(min-width:768px){ header{padding:16px 40px} }
  .head-row{display:flex; align-items:center; justify-content:space-between; gap:16px}
  .brand h1{font-family:var(--display); font-size:13px; font-weight:700; letter-spacing:.35em; text-transform:uppercase; color:#EAEAEA; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  @media(min-width:768px){ .brand h1{font-size:14px} }
  .brand p{margin-top:4px; font-family:var(--ghost); font-style:italic; font-size:13px; color:rgba(0,229,255,.6)}
  .log-btn{flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:8px 16px; background:transparent; color:rgba(209,209,209,.7); font-family:var(--mono); font-size:10px; letter-spacing:.3em; text-transform:uppercase; cursor:pointer; transition:.2s}
  .log-btn:hover{border-color:rgba(0,229,255,.6); color:#D1D1D1}
  .log-btn svg{width:14px; height:14px}
  .progress{margin-top:12px; height:1px; width:100%; background:rgba(255,255,255,.07); position:relative}
  .progress > i{position:absolute; left:0; top:0; height:1px; background:rgba(0,229,255,.7); transition:width .7s cubic-bezier(.16,1,.3,1)}

  /* Stage */
  main{position:relative; flex:1 1 auto; min-height:0; overflow:hidden}
  .page{position:absolute; inset:0; display:grid; grid-template-columns:1fr; grid-template-rows:auto 1fr; opacity:0; transform:translateY(60px); transition:opacity .65s cubic-bezier(.16,1,.3,1), transform .65s cubic-bezier(.16,1,.3,1)}
  .page.enter{opacity:1; transform:none}
  @media(min-width:768px){
    .page{grid-template-columns:1fr 1fr; grid-template-rows:1fr}
  }
  .img-wrap{position:relative; height:34vh; overflow:hidden}
  @media(min-width:768px){ .img-wrap{height:100%} }
  .img-wrap img{width:100%; height:100%; object-fit:cover; display:block; transform:scale(1.06); transition:transform 1.4s cubic-bezier(.16,1,.3,1)}
  .page.enter .img-wrap img{transform:none}
  .img-wrap .grad{position:absolute; inset:0; background:linear-gradient(to top, #080808, rgba(8,8,8,.1) 60%, transparent)}
  @media(min-width:768px){ .img-wrap .grad{background:linear-gradient(to right, transparent, rgba(8,8,8,.05) 60%, #080808)} }
  .chap-no{position:absolute; left:20px; top:16px; font-family:var(--mono); font-size:10px; letter-spacing:.45em; text-transform:uppercase; color:rgba(0,229,255,.7)}
  .text-wrap{position:relative; min-height:0; overflow-y:auto; padding:32px 24px; display:flex; flex-direction:column; justify-content:center}
  @media(min-width:768px){ .text-wrap{padding:48px 56px} }
  .text-inner{margin:0 auto; width:100%; max-width:36rem; position:relative}
  .kicker{font-family:var(--mono); font-size:10px; letter-spacing:.45em; text-transform:uppercase; color:var(--ochre)}
  .text-wrap h2{margin-top:12px; font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:-.01em; line-height:1.05; font-size:30px; color:#EAEAEA}
  @media(min-width:768px){ .text-wrap h2{font-size:44px} }
  .rule{margin-top:20px; height:1px; width:64px; background:rgba(154,107,65,.7)}
  .text-wrap p.body{margin-top:24px; font-size:17px; line-height:1.7; color:#D1D1D1}
  @media(min-width:768px){ .text-wrap p.body{font-size:19px} }
  .text-wrap p.body.haunt{filter:blur(.4px)}
  .whisper{margin-top:28px; border-left:1px solid rgba(0,229,255,.4); padding-left:16px; font-family:var(--ghost); font-style:italic; font-size:17px; line-height:1.6; color:rgba(0,229,255,.8)}
  @media(min-width:768px){ .whisper{font-size:19px} }
  .ghost-no{position:absolute; right:8px; top:-8px; font-family:var(--display); font-weight:700; font-size:96px; line-height:1; color:rgba(255,255,255,.035); pointer-events:none}
  @media(min-width:768px){ .ghost-no{right:24px; top:24px; font-size:160px} }

  /* Footer */
  footer{flex:0 0 auto; border-top:1px solid rgba(255,255,255,.07); padding:16px 20px 20px; display:flex; flex-direction:column; gap:12px}
  @media(min-width:768px){ footer{padding:16px 40px 20px} }
  .meter{display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:10px; letter-spacing:.35em; text-transform:uppercase; color:rgba(209,209,209,.4)}
  .meter .ox{color:rgba(154,107,65,.8)}
  .nav{display:flex; align-items:center; justify-content:space-between; gap:16px}
  .nav .back{display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:12px 16px; background:transparent; color:rgba(209,209,209,.6); font-family:var(--mono); font-size:10px; letter-spacing:.3em; text-transform:uppercase; cursor:pointer; transition:.2s}
  .nav .back:hover{border-color:rgba(0,229,255,.6); color:#D1D1D1}
  .nav .back:disabled{opacity:.2; pointer-events:none}
  .nav .next{flex:1; display:inline-flex; align-items:center; justify-content:center; gap:12px; border:1px solid rgba(0,229,255,.4); border-radius:999px; padding:16px 32px; background:rgba(0,229,255,.06); color:#D1D1D1; font-family:var(--mono); font-size:11px; letter-spacing:.35em; text-transform:uppercase; cursor:pointer; transition:.2s}
  .nav .next:hover{border-color:var(--teal); background:rgba(0,229,255,.12)}
  .nav .next:disabled{border-color:rgba(255,255,255,.1); background:transparent; color:rgba(209,209,209,.3); box-shadow:none; pointer-events:none}
  .nav .next svg{width:20px; height:20px}
  .nav .next:hover svg{transform:translateX(4px)}
  .nav .next svg{transition:transform .5s}

  /* Deck log overlay */
  .overlay{position:fixed; inset:0; z-index:40; display:none}
  .overlay.open{display:flex}
  .overlay .scrim{position:absolute; inset:0; background:rgba(8,8,8,.8); backdrop-filter:blur(4px); border:0; cursor:pointer}
  .overlay aside{position:relative; z-index:1; height:100%; width:100%; max-width:24rem; border-right:1px solid rgba(255,255,255,.1); background:rgba(11,11,11,.96); display:flex; flex-direction:column}
  .ov-head{display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,.1); padding:20px 24px}
  .ov-head .k{font-family:var(--mono); font-size:10px; letter-spacing:.45em; text-transform:uppercase; color:var(--ochre)}
  .ov-head .t{margin-top:4px; font-family:var(--display); font-size:14px; letter-spacing:.15em; text-transform:uppercase; color:#EAEAEA}
  .ov-head button{border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:8px; background:transparent; color:rgba(209,209,209,.7); cursor:pointer}
  .ov-head button:hover{border-color:rgba(0,229,255,.6); color:#D1D1D1}
  .ov-head svg{width:16px; height:16px; display:block}
  .ov-list{flex:1; overflow-y:auto}
  .ov-list button{display:flex; width:100%; align-items:center; gap:16px; padding:12px 24px; text-align:left; background:transparent; border:0; cursor:pointer; transition:.2s}
  .ov-list button:hover{background:rgba(255,255,255,.03)}
  .ov-list button.active{background:rgba(0,229,255,.1)}
  .ov-list .n{width:32px; flex:0 0 auto; font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:rgba(209,209,209,.4)}
  .ov-list button.active .n{color:var(--teal)}
  .ov-list .ttl{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; color:rgba(209,209,209,.7)}
  .ov-list button.active .ttl{color:#EAEAEA}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="head-row">
      <div class="brand">
        <h1>Trapped in Bergen Engines</h1>
        <p>and the ghost of Gregor</p>
      </div>
      <button class="log-btn" id="openLog" aria-label="Open the deck log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Deck Log
      </button>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </header>

  <main id="stage"></main>

  <footer>
    <div class="meter">
      <span id="deckLabel">Deck 01 / 30</span>
      <span class="ox" id="oxLabel">Oxygen · less than a minute</span>
    </div>
    <div class="nav">
      <button class="back" id="prev" aria-label="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back
      </button>
      <button class="next" id="next">
        <span id="nextLabel">Turn the page</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </footer>
</div>

<div class="overlay" id="overlay">
  <button class="scrim" id="scrim" aria-label="Close the deck log"></button>

    <div class="ov-head">
      <div>
        <p class="k">Deck Log</p>
        <p class="t">Thirty Pages</p>
      </div>
      <button id="closeLog" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <nav class="ov-list" id="ovList"></nav>
  </aside>

<script>
const STORY = [
  {n:1,title:"The Night Shift",text:`The works sat at the edge of the fjord like something abandoned mid-thought. Anders Voss clocked in at eleven, as he had for nine years, and the gate swallowed him the way it swallowed everyone. Rain moved sideways across the water. Above him the stacks breathed. Somewhere deep in the belly of the building an engine was cooling, ticking like a clock nobody had wound.`,whisper:`You're late.`},
  {n:2,title:"The Cathedral of Iron",text:`Nobody called it a factory. The men called it the cathedral. Six engine halls, each tall enough to hold a church, each filled with diesel blocks the size of houses. Anders walked the long axis of Hall 2 with his torch held low, and the engines stood around him in the dark like a congregation, patient, waiting for the sermon to begin.`,whisper:``},
  {n:3,title:"The Foreman's Warning",text:`Old Rune met him at the tool crib and did not say hello. "Hall 4 is off the roster tonight," he said. "Don't go past the blue door. Whatever you hear, don't answer it." Anders laughed. Rune did not. He turned his face away, and in the yellow lamplight Anders saw that the old man's hands were shaking.`,whisper:`He knows. He has always known.`},
  {n:4,title:"The Ledger",text:`The shift ledger lay open on the bench. Names, hours, initials. And on the page for the fourteenth of March, nineteen sixty-eight, one name had been scratched through so hard the pen tore the paper. Anders tilted it toward the lamp. He could still read it underneath. G—R—E—G—O—R.`,whisper:``},
  {n:5,title:"The First Whisper",text:`At 01:40 the test cell went quiet. Not off — quiet. The fans stopped, the hum stopped, and into that vacuum came a sound Anders had never heard inside an engine hall. A voice. Thin. Close. Somewhere behind the dead engine, someone was breathing, and the breathing was trying to become words.`,whisper:`...cold. It is so cold in here.`,haunt:true},
  {n:6,title:"Hall Four",text:`He should have gone back. Instead he took the corridor under the pipe bridge and came out into Hall 4, where the engines had been shut down for a decade and were still, somehow, warm. Thirty of them in a line, fading into the dark. The whisper came again, and this time it came from the far end of the line.`,whisper:``},
  {n:7,title:"The Doors",text:`Behind him the great doors began to move. Not slammed — closed. Slowly. Deliberately. The amber wedge of light between them thinned to a blade, then to a thread, then to nothing at all. Anders ran and hit the steel with both palms, and the sound did not carry anywhere.`,whisper:`Stay.`},
  {n:8,title:"Painted Shut",text:`The seam was welded. The paint had been laid over the weld so thickly it had bubbled, and the bubbles had been painted too, years ago, by someone who wanted this door to be a wall. A chain hung beside it, older than Anders, rusted into one piece. He put his shoulder to the metal until it hurt.`,whisper:``},
  {n:9,title:"They Turn Over",text:`The first engine started without a starter. Then the second. Then the whole line of them, one after another, thirty dead engines rolling over in the dark like something waking along a spine. Flywheels blurred. Valve covers breathed steam. Anders stood in the middle of the aisle with his torch hanging at his side.`,whisper:`Listen. They remember me.`},
  {n:10,title:"Vapour",text:`The oil mist in the air began to gather. It should not have gathered. It thinned into ribbons and the ribbons turned, and beside Anders' ear the vapour held a shape for one moment — a jaw, an eye, an old man's patience — then let go and drifted apart. He did not move. He could not.`,whisper:`You have his hands.`,haunt:true},
  {n:11,title:"Nineteen Sixty-Eight",text:`And then the hall was not dark. It was amber, and it was 1968, and a young man in oil-black overalls knelt inside an opened crankcase with a work lamp beside him, whistling. He was tall. He was quick. He had a wife and a small boat and a son who was going to be an engineer. His name was Gregor Halvorsen.`,whisper:``},
  {n:12,title:"The Cover",text:`The bolt went in under his hand — no, under someone's hand. Gregor looked up. Above him three men were already lowering the crankcase cover, and their faces were not surprised. They were only tired. It came down, and the light went out, and the last thing that reached Anders across fifty-eight years was not a scream. It was a knock. One knock. Then nothing.`,whisper:`They said it was an accident. Three of them said it.`},
  {n:13,title:"The Report",text:`The folder was in the third drawer, and the drawer had not been opened in a very long time. Anders read it by torchlight. Fatalities: nil. Injuries: nil. Incident: none recorded. A man had walked into the works in the morning and never come out, and on paper, in ink, it had simply not happened.`,whisper:``},
  {n:14,title:"The Toolbox",text:`Gregor's toolbox stood on the floor under bench four, and it was warm. Not sun-warm. Warm the way a hand is warm. Anders crouched and opened it, and inside, laid in their own dents, the tools waited in the order a careful man leaves them. Under his fingers the spanner turned a little, as though it had just been set down.`,whisper:`I kept working. There was still work.`},
  {n:15,title:"The Lights",text:`The hall lights died in a long slow stagger, one bay after another, and the emergency lamps came on green along the walls. In that green Anders could not tell the engines from the shadows. He stood still and counted his own breaths, and by the twelfth he understood that something else in the hall was breathing in time with him.`,whisper:``,haunt:true},
  {n:16,title:"The Telephone",text:`The wall telephone was older than the works. He lifted the receiver and the line was already open, and what came out of it was not a dial tone but a great iron noise, piston and valve, the inside sound of an engine, as if the building itself were holding the other end. He shouted his name down the line. Twice.`,whisper:`I heard you the first time.`},
  {n:17,title:"The Radio",text:`The valve radio on the shelf was tuned to nothing, and the needle had frozen where nothing was. Static moved through the speaker like water. Anders turned the dial and the static turned with it, and underneath, far underneath, a voice was saying his name in the rhythm of a machine. An-ders. An-ders. An-ders. Patient as a stroke.`,whisper:``},
  {n:18,title:"Hall Five",text:`Past the arch the floor was not flat. Hall 5 had been built over the old dry dock, and the walkway crossed it on steel legs. Anders stepped out onto the grating and felt it tilt under him, one degree, two. Below, in the pit, something enormous turned over in its sleep and the handrail sang in his grip.`,whisper:`Careful. The drop is longer than it looks.`},
  {n:19,title:"Running",text:`He ran. Not for the yard gate — that was three halls behind him and welded — but for the sea gate, the old tidal door on the north wall where the boats used to come in to have their engines lifted. He ran with the torch whipping across grease and pipework, and behind him all of Hall 4 began to turn over, together, in one long rising note.`,whisper:``},
  {n:20,title:"The Sea Gate",text:`The gate had not been opened since the seventies. The hinges were one piece with the salt. Black water worked through the seams and ran down the steel in thin fingers, and when Anders put his ear to the metal he could hear the fjord on the other side — deep, indifferent, waiting to be let in. He found the wheel. It would not turn.`,whisper:`You will drown us both.`,haunt:true},
  {n:21,title:"The Gauge",text:`The pressure gauge beside the gate had a crack across its face. Anders raised the torch, and inside the glass, behind the trembling needle, there was a face. An old face. Not reflected — there was nothing behind him to reflect. It looked at him the way a man looks at a tool he has been waiting a very long time to use.`,whisper:``},
  {n:22,title:"In the Metal",text:`Polished housings. That was all. But he walked past number nineteen and saw himself in the chromium — torch, shoulders, wet hair — and standing half a step behind his own reflection, taller than him, was somebody wearing overalls that had not been made for fifty years.`,whisper:`Turn around. I am tired of being behind you.`},
  {n:23,title:"Gregor",text:`So he turned. And Gregor was there, faint as a breath on glass, one hand already out. "You know what they did," he said. "So do I. So does the iron. I have been in this building for fifty-eight winters, and I have kept every one of these engines turning by wanting to. And I am so tired."`,whisper:`Stay.`},
  {n:24,title:"The Crankcase",text:`He went back for it. Hall 4, bench four, engine nine, the cover still bolted down after all these years. Anders put a spanner to the nuts and turned them — one, two, three, four — and lifted the cover, and the smell that came out of it took the breath out of him, and in the sludge at the bottom of the sump, under the wrench he was still holding, was everything that was left of Gregor Halvorsen.`,whisper:``},
  {n:25,title:"The Works Wakes",text:`The engines did not start. They detonated into life, all thirty at once, and the sound went through Anders like a physical hand. Steam screamed from every joint. Sparks came off the flywheels in sheets. Somewhere a pipe the width of a man burst and began to fill the aisle with scalding white. The building was not angry. It was grieving.`,whisper:`DON'T. TAKE. HIM. OUT.`,haunt:true},
  {n:26,title:"Carrying Him",text:`Anders wrapped what was left in his own jacket and carried it against his chest. It was small under the canvas, and heavier than a man should be. The corridors filled with teal vapour and the vapour filled with a voice, and the voice followed him down five hundred metres of hall, and it was not asking anymore.`,whisper:`PUT HIM BACK.`},
  {n:27,title:"The Gate Gives",text:`The wheel turned on the fourth try. The gate opened a hand's width and the fjord came through it like a fist. Black water took the floor of Hall 5 in a single movement, took the walkway, took Anders' feet out from under him, and carried him rolling toward the arch with the bundle still locked in his arms. Above the waterline the ghost of Gregor Halvorsen watched the sea take him, and did not follow.`,whisper:``},
  {n:28,title:"Morning",text:`The day shift came in at six and stopped in the doorway. The floors were dry. The engines were cold and quiet and clean. Every gate was shut. Every gauge read normal. There was no water in Hall 5, no burn marks, no tools out of place, and no Anders Voss on any rota, in any locker, or on any list.`,whisper:``},
  {n:29,title:"The New Boy",text:`They hired someone in October. Young, keen, from Voss on the other side of the mountain, which is a coincidence nobody thought about. On his fourth night he stopped in the pipe corridor and tilted his head, because above the tick of the cooling iron he could hear something that sounded like a man, and it was saying a name.`,whisper:`...An-ders. An-ders.`},
  {n:30,title:"Every Engine Has a Heart",text:`The works runs on. Twelve hundred men, six halls, engines the size of houses going out to ships all over the world. And if you are ever there on the night shift, in Hall 4, near bench four, put your hand flat on engine number nine. It is warm. Under the bolts something turns over — slowly, patiently, keeping time. There are two of them in there now. They are both working.`,whisper:`End of the first shift. Go home.`,haunt:true}
];

const pad = (n) => String(n).padStart(2,"0");
const stage = document.getElementById("stage");
const bar = document.getElementById("bar");
const deckLabel = document.getElementById("deckLabel");
const oxLabel = document.getElementById("oxLabel");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const nextLabel = document.getElementById("nextLabel");
const overlay = document.getElementById("overlay");
const ovList = document.getElementById("ovList");

let index = 0;

function oxygenLeft(i){
  const s = (30 - i) * 45;
  if (s <= 45) return "less than a minute";
  const m = Math.round(s/60);
  return m + " minute" + (m===1?"":"s");
}

function render(){
  const p = STORY[index];
  const haunt = p.n % 5 === 0;
  const page = document.createElement("section");
  page.className = "page";
  page.setAttribute("aria-label", "Chapter " + p.n + " of 30: " + p.title);
  page.innerHTML =
    '<div class="img-wrap">' +
      '<img src="images/' + pad(p.n) + '.png" alt="Illustration for chapter ' + p.n + ': ' + p.title + '" loading="lazy" />' +
      '<span class="grad"></span>' +
      '<span class="chap-no">' + pad(p.n) + ' / 30</span>' +
    '</div>' +
    '<div class="text-wrap">' +
      '<span class="ghost-no">' + pad(p.n) + '</span>' +
      '<div class="text-inner">' +
        '<p class="kicker">Bergen Engines · Night Shift</p>' +
        '<h2>' + p.title + '</h2>' +
        '<div class="rule"></div>' +
        '<p class="body' + (haunt ? ' haunt' : '') + '">' + p.text + '</p>' +
        (p.whisper ? '<p class="whisper">' + p.whisper + '</p>' : '') +
      '</div>' +
    '</div>';
  // remove old pages
  const old = stage.querySelector(".page.enter");
  stage.appendChild(page);
  requestAnimationFrame(() => {
    requestAnimationFrame(() => page.classList.add("enter"));
  });
  if (old){ old.classList.remove("enter"); setTimeout(() => old.remove(), 700); }

  const progress = index / (STORY.length - 1);
  bar.style.width = Math.max(progress*100, 2) + "%";
  deckLabel.textContent = "Deck " + pad(p.n) + " / 30";
  oxLabel.textContent = "Oxygen · " + oxygenLeft(index);
  prevBtn.disabled = index === 0;
  const isLast = index === STORY.length - 1;
  nextBtn.disabled = isLast;
  nextLabel.textContent = isLast ? "The works runs on" : "Turn the page";
  renderList();
}

function renderList(){
  ovList.innerHTML = "";
  STORY.forEach((p) => {
    const b = document.createElement("button");
    if (p.n === STORY[index].n) b.classList.add("active");
    b.innerHTML = '<span class="n">' + pad(p.n) + '</span><span class="ttl">' + p.title + '</span>';
    b.addEventListener("click", () => { goTo(p.n - 1); closeLog(); });
    ovList.appendChild(b);
  });
}

function goTo(i){
  const t = Math.max(0, Math.min(STORY.length - 1, i));
  if (t === index) return;
  index = t;
  render();
}
function next(){ goTo(index + 1); }
function prev(){ goTo(index - 1); }

nextBtn.addEventListener("click", next);
prevBtn.addEventListener("click", prev);
document.getElementById("openLog").addEventListener("click", openLog);
document.getElementById("closeLog").addEventListener("click", closeLog);
document.getElementById("scrim").addEventListener("click", closeLog);

function openLog(){ overlay.classList.add("open"); }
function closeLog(){ overlay.classList.remove("open"); }

window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " "){ e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp"){ e.preventDefault(); prev(); }
  else if (e.key === "Escape"){ closeLog(); }
});

render();
</script>
</body>
</html>
